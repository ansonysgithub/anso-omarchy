# NVIDIA HDMI/DP audio: only expose the first port (Samsung SE790C ultrawide).
# The other ports (U32J59x etc.) are left out so audio can never switch to them.
[General]
auto-profiles = yes

[Mapping hdmi-stereo]
description = Digital Stereo (HDMI)
device-strings = hdmi:%f
paths-output = hdmi-output-0
channel-map = left,right
priority = 9
direction = output
