# NVIDIA HDMI audio kept flipping to the U32J59x port instead of the SE790C
# ultrawide. Restrict the card to the ultrawide's port only.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_01_00.1" } ]
    actions = {
      update-props = {
        device.profile-set = "nvidia-ultrawide-only.conf"
        device.profile = "output:hdmi-stereo"
      }
    }
  }
]
