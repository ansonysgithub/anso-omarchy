# Yeti Nano: PipeWire offers no duplex (output+input) profile for this mic,
# so it defaulted to output-only and apps couldn't see the microphone.
# Pro Audio exposes both the mic and the headphone jack.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-Blue_Microphones_Yeti_Nano.*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
]
